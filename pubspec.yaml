name: receipt_scanner_app
description: "A Flutter application that scans receipts in real-time using on-device ML with TensorFlow Lite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  equatable: ^2.0.7
  injectable: ^2.5.0
  camera: ^0.11.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
flutter:
  uses-material-design: true
